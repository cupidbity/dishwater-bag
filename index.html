<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dishwater bag</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-frame">
    <header class="hud">
      <span class="hud-item">score <b id="scoreValue">0</b></span>
      <span class="hud-item">best <b id="bestValue">0</b></span>
      <span class="hud-item">lives <b id="livesValue">3</b></span>
    </header>

    <canvas id="gameCanvas" width="640" height="720"></canvas>

    <div id="overlay" class="overlay">
      <canvas id="titleCat" class="title-cat" width="380" height="360"></canvas>
      <h1 id="overlayTitle">dishwater bag</h1>
      <p id="overlayText">catch the cats, dodge the poop. drop three cats and it's over.</p>
      <p class="overlay-keys">&larr; &rarr; or A / D to move &middot; P to pause</p>
      <button id="startButton" type="button">start</button>

      <section id="leaderboard" class="leaderboard hidden">
        <h2 class="leaderboard-title">best catchers</h2>
        <ol id="leaderboardList" class="leaderboard-list"></ol>
        <p id="leaderboardNote" class="leaderboard-note hidden"></p>
      </section>
    </div>

    <div id="nameOverlay" class="overlay name-overlay hidden">
      <h1>who's catching?</h1>
      <p>this goes on the leaderboard, and it sticks with you next time.</p>
      <form id="nameForm" class="name-form" autocomplete="off">
        <input
          id="nameInput"
          class="name-input"
          type="text"
          maxlength="16"
          required
          placeholder="your name"
          aria-label="your name"
        />
        <button type="submit">let's go</button>
      </form>
    </div>
  </div>

  <script src="leaderboard.js"></script>
  <script src="game.js"></script>
</body>
</html>
